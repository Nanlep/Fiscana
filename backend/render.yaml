# Render Deployment Configuration
# NOTE: DATABASE_URL and DIRECT_URL must point to the Supabase database.
# Set them manually in the Render dashboard (Environment tab), NOT from a Render database.
# Supabase pooler URL format:
#   postgresql://postgres.[PROJECT-REF]:[PASSWORD]@aws-0-us-east-1.pooler.supabase.com:5432/postgres

services:
  # Web Service (Backend API)
  - type: web
    name: fiscana-backend
    env: node
    plan: starter
    buildCommand: npm install && npm run build && npm run prisma:generate
    startCommand: npm start  # Starts with --max-old-space-size=256 (see package.json)
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        sync: false # Set manually in Render dashboard
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard → Supabase pooler URL
      - key: DIRECT_URL
        sync: false # Set manually in Render dashboard → Supabase direct URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: BANI_PUBLIC_KEY
        sync: false
      - key: BANI_SECRET_KEY
        sync: false
      - key: MONO_PUBLIC_KEY
        sync: false
      - key: MONO_SECRET_KEY
        sync: false

# IMPORTANT: Do NOT define a Render database here.
# The application uses Supabase (PostgreSQL) as its database.
# Defining a Render database and using fromDatabase: would point
# the app to an empty Render DB instead of Supabase where data lives.
